---
layout: research
---
<article class="post inner-page">
    <header class="page-heading">
        <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
        <h1>{{ page.title | escape }}</h1>
        <time class="timeline-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
</article>
