<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.navbar_title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.data.profile.primary_name }}</title>
    <meta name="description" content="{{ page.description | default: site.data.profile.description | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="site-width header-inner">
            <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
            <nav class="site-nav" aria-label="Main navigation">
                {% for item in site.data.navigation.pages %}
                    <a href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% elsif item.name == 'Blog' and page.collection == 'posts' %} aria-current="location"{% endif %}>{{ item.name }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>
    <main class="site-width {{ page.main_class }}" id="main-content">
        {{ content }}
    </main>
    <footer class="site-width site-footer">
        <span>&copy; {{ 'now' | date: '%Y' }} {{ site.data.profile.primary_name }}</span>
    </footer>
</body>
</html>
