short_bio: >-
  <p>
    I’m a final-year PhD candidate in the School of Electrical and Computer Engineering at the University of Sydney, advised by
    <a href="https://sites.google.com/view/lupingzhou">Luping Zhou</a>, with mentorship from
    <a href="https://sites.google.com/view/lei-hs-wang">Lei Wang</a> and
    <a href="https://lingqiao-adelaide.github.io/lingqiaoliu.github.io/">Lingqiao Liu</a>.
    I also received my master’s degree from the University of Sydney.
  </p>
  <p>
    I work on <strong>multimodal large language models</strong>, with research interests in <strong>AI agents and AI for healthcare</strong>.
    I study how models connect visual and textual information, follow instructions, and reason across tasks.
    My research covers multimodal embeddings and model evaluation, with applications in medical vision–language systems and video understanding.
  </p>
  <p>
    At <strong>TikTok Trust &amp; Safety</strong>, I worked as a machine learning engineer intern, building scalable LLM training frameworks and training multimodal video embedding models for content governance.
    Previously, I was a research intern at the University of Illinois Urbana-Champaign.
  </p>
  <p>
    I’m seeking <strong>Applied Scientist, Research Scientist, and Machine Learning Engineer</strong> roles, and I’m also open to <strong>postdoctoral positions</strong>.
  </p>
  <p class="collaboration-note">
    I welcome research discussions and collaborations in multimodal learning, AI agents, and AI4Health.
  </p>
