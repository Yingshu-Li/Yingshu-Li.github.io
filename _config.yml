data_dir: data
includes_dir: includes
layouts_dir: layouts

baseurl: "" # the subpath of your site, e.g. /blog

markdown: kramdown
plugins:
  - jekyll-email-protect



collections:
  - publications
  - news

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:day/:title/
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - data
  - includes
  - layouts
