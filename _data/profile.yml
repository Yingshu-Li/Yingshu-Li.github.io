short_bio: >-
  <p>
    I’m a final-year PhD candidate in the School of Electrical and Computer Engineering at the University of Sydney, advised by
    <a href="https://sites.google.com/view/lupingzhou">Luping Zhou</a>, with mentorship from
    <a href="https://sites.google.com/view/lei-hs-wang">Lei Wang</a> and
    <a href="https://lingqiao-adelaide.github.io/lingqiaoliu.github.io/">Lingqiao Liu</a>.
    I also received my master’s degree from the University of Sydney.
  </p>
  <p>
    My research interests span <strong>multimodal large language models, AI agents, and AI for healthcare</strong>.
    I’m interested in how AI systems understand multimodal information, follow instructions, and reason across tasks and domains.
    My work includes multimodal embeddings, model evaluation, and medical vision–language systems, with radiology report generation as one application.
    More broadly, I aim to develop capable and reliable multimodal AI for both healthcare and real-world applications.
  </p>
  <p>
    Alongside my academic research, I interned with <strong>TikTok Trust &amp; Safety</strong>, where I built scalable LLM training frameworks and trained multimodal video embedding models for large-scale content governance.
    I also spent time as a research intern at the University of Illinois Urbana-Champaign.
  </p>
  <p>
    I’m currently exploring opportunities as an <strong>Applied Scientist, Research Scientist, or Machine Learning Engineer</strong>, as well as <strong>postdoctoral positions</strong>.
    I welcome research discussions and collaborations in multimodal learning, AI agents, and AI4Health.
  </p>
